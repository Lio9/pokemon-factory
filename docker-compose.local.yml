services:
  pokedex:
    build:
      context: ./backend
      dockerfile: Dockerfile.module
      args:
        MODULE_PATH: pokedex
        JAR_PATTERN: pokedex-*.jar
    environment:
      SQLITE_DB_PATH: /workspace/data/pokemon-factory.db
    volumes:
      - backend-db:/workspace/data
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - pokemon-network

  battle:
    build:
      context: ./backend
      dockerfile: Dockerfile.module
      args:
        MODULE_PATH: battle
        JAR_PATTERN: battle-*.jar
    environment:
      SQLITE_DB_PATH: /workspace/data/pokemon-factory.db
      JWT_SECRET: local-docker-jwt-secret
    volumes:
      - backend-db:/workspace/data
    ports:
      - "8090:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      pokedex:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - pokemon-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://pokedex:8081/api/pokedex
        VITE_BATTLE_API_BASE: http://battle:8090/api
        VITE_DAMAGE_API_BASE: http://battle:8090/api/damage
        VITE_SPRITES_BASE: http://pokedex:8081
    depends_on:
      pokedex:
        condition: service_healthy
      battle:
        condition: service_started
    ports:
      - "7890:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - pokemon-network

volumes:
  backend-db:

networks:
  pokemon-network:
    driver: bridge
