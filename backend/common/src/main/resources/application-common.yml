spring:
  datasource:
    url: ${SQLITE_DB_URL:}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
      connection-test-query: SELECT 1
      connection-init-sql: PRAGMA journal_mode=WAL; PRAGMA foreign_keys = ON
      validation-timeout: 3000
      auto-commit: true
      pool-name: PokemonFactorySQLiteCP
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

pokemon-factory:
  database:
    # 仅做 schema 迁移（补充缺失列/索引），不做全量初始化
    migrate-on-startup: true
    # 兼容旧环境保留该配置；当前版本由 Python 脚本统一初始化
    csv-directory: ${CSV_DIR:}
    remote-csv-base-url: ${REMOTE_CSV_BASE_URL:https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv}
    csv-cache-directory: ${CSV_CACHE_DIR:}

logging:
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level app=${spring.application.name:-unknown} thread=%thread logger=%logger{36} trace=%X{traceId:-} span=%X{spanId:-} msg=%msg%n%wEx"
  level:
    org.apache.ibatis: info
    org.mybatis: info
    java.sql: warn
    java.sql.Connection: warn
    java.sql.Statement: warn
    java.sql.PreparedStatement: warn
    java.sql.ResultSet: warn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      enabled: false

info:
  app:
    database-mode: embedded-sqlite
    android-migration-ready: true
