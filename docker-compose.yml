services:
  # ─── 图鉴服务 ────────────────────────────────────
  pokedex:
    build:
      context: ./backend
      dockerfile: Dockerfile.module
      args:
        MODULE_PATH: pokedex
        JAR_PATTERN: pokedex-*.jar
    image: ghcr.io/${REPO_OWNER:-pokemon-factory}/pokedex:${TAG:-latest}
    environment:
      SQLITE_DB_PATH: /workspace/data/pokemon-factory.db
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Duser.timezone=Asia/Shanghai
    volumes:
      - backend-db:/workspace/data
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pokemon-network

  # ─── 对战服务 ────────────────────────────────────
  battle:
    build:
      context: ./backend
      dockerfile: Dockerfile.module
      args:
        MODULE_PATH: battle
        JAR_PATTERN: battle-*.jar
    image: ghcr.io/${REPO_OWNER:-pokemon-factory}/battle:${TAG:-latest}
    environment:
      SQLITE_DB_PATH: /workspace/data/pokemon-factory.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Duser.timezone=Asia/Shanghai
    volumes:
      - backend-db:/workspace/data
    ports:
      - "8090:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      pokedex:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pokemon-network

  # ─── 前端 Nginx ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://pokedex:8081/api/pokedex
        VITE_BATTLE_API_BASE: http://battle:8090/api
        VITE_DAMAGE_API_BASE: http://battle:8090/api/damage
        VITE_SPRITES_BASE: http://pokedex:8081
    image: ghcr.io/${REPO_OWNER:-pokemon-factory}/frontend:${TAG:-latest}
    depends_on:
      pokedex:
        condition: service_healthy
      battle:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-7890}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pokemon-network

volumes:
  backend-db:
    name: pokemon-factory-db

networks:
  pokemon-network:
    name: pokemon-factory-network
    driver: bridge
